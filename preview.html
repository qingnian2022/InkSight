<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8" /><title>preview</title>
<script>
  // 首帧前应用主题参数，避免「先浅后深」的合成残留（headless 截图会捕获到混合画面）
  (function () {
    var q = new URLSearchParams(location.search);
    if (q.get("theme") === "dark") document.documentElement.dataset.theme = "dark";
    var at = q.get("at");
    if (at === "purple" || at === "blue" || at === "pink") document.documentElement.dataset.accent = at;
    var skin = q.get("skin");
    if (skin === "macos" || skin === "default") {
      document.documentElement.dataset.skin = skin;
    } else {
      document.documentElement.dataset.skin =
        localStorage.getItem("md-rust.skin") === "default" ? "default" : "macos";
    }
  })();
</script>
</head>
<body style="margin:0">
<script>
  window.onerror = function (msg, src, line, col, err) {
    document.title = "ERR " + (err && err.stack ? err.stack.split("\n")[0] : msg);
    var pre = document.createElement("pre");
    pre.id = "boot-error";
    pre.textContent = (err && err.stack) || msg;
    pre.style.cssText = "color:#b3261e;padding:16px;font:12px/1.5 monospace;white-space:pre-wrap";
    document.body.appendChild(pre);
  };
  window.addEventListener("unhandledrejection", function (e) {
    var err = e.reason;
    document.title = "REJ " + (err && err.message ? err.message : String(err));
    var pre = document.createElement("pre");
    pre.id = "boot-error";
    pre.textContent = (err && err.stack) || String(err);
    pre.style.cssText = "color:#b3261e;padding:16px;font:12px/1.5 monospace;white-space:pre-wrap";
    document.body.appendChild(pre);
  });
</script>
<div id="app"></div>
<script type="module" src="/src/dev-preview.ts"></script></body></html>
