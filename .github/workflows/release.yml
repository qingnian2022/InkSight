name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装依赖
        run: pnpm install --no-frozen-lockfile

      - name: 同步版本号（tag 为唯一来源）
        id: ver
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          else
            VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
            TAG="v$VERSION"
          fi
          node scripts/bump-version.mjs "$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "本次发布版本：$TAG"

      - name: 前端类型检查与构建
        run: pnpm build

      - name: 打包并发布到 GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.ver.outputs.tag }}
          releaseName: ${{ steps.ver.outputs.tag }}
          releaseBody: 见提交记录
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ''

      - name: 同步到 Gitee Release
        if: ${{ env.GITEE_TOKEN != '' }}
        run: node scripts/publish-gitee.mjs --notes "${{ steps.ver.outputs.tag }}"

      # 把 CI 改好的版本号提交回主分支，本地仓库不会落后于 release
      - name: 回写版本号到默认分支
        if: github.ref_type == 'tag'
        continue-on-error: true
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          FILES="package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock"
          if git diff --quiet -- $FILES; then
            echo "版本号与 tag 一致，无需回写"
            exit 0
          fi
          git add $FILES
          git commit -m "chore(release): ${{ steps.ver.outputs.tag }} [skip ci]"
          # 目标分支必须写全 refs/heads/…，否则 git 无法猜出远端分支名（HEAD 是游离提交）
          git push origin "HEAD:refs/heads/${{ github.event.repository.default_branch }}"
