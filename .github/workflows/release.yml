name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装依赖
        run: pnpm install --no-frozen-lockfile

      - name: 解析发布版本
        id: ver
        shell: bash
        run: |
          CONF=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            if [ "v$CONF" != "$TAG" ]; then
              echo "::error::tag 与 tauri.conf.json 的 version 不一致（tag=$TAG，conf=$CONF）"
              exit 1
            fi
          else
            TAG="v$CONF"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "本次发布版本：$TAG"

      - name: 前端类型检查与构建
        run: pnpm build

      - name: 打包并发布到 GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.ver.outputs.tag }}
          releaseName: ${{ steps.ver.outputs.tag }}
          releaseBody: 见提交记录
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ''

      - name: 同步到 Gitee Release
        if: ${{ env.GITEE_TOKEN != '' }}
        run: node scripts/publish-gitee.mjs --notes "${{ steps.ver.outputs.tag }}"
